<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludoteca Digital</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <h1>🎲 Ludoteca Digital</h1>
        <p class="subtitle">Juegos de mesa adaptados al formato digital</p>
      </div>
    </header>

    <main class="container">
      <div class="filters">
        <button class="filter-btn active" data-filter="todos">🎲 Todos</button>
        <button class="filter-btn" data-filter="publico">🌐 Públicos</button>
        <button class="filter-btn" data-filter="privado">🔒 Privados</button>
      </div>
      <div id="games-grid" class="games-grid">
        <!-- Los juegos se cargarán desde JavaScript -->
      </div>
    </main>

    <footer>
      <div class="container">
        <p>© 2026 Ludoteca Digital - Todos los derechos reservados</p>
      </div>
    </footer>

    <script src="games.js"></script>
    <script src="app.js"></script>
  </body>
</html>
